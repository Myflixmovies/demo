backend:
  name: github
  repo: Myflixmovies/demo
  branch: main

media_folder: "images/uploads"
public_folder: "/demo/images/uploads"

collections:
  - name: "movies"
    label: "Movies"
    folder: "content/movies"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - label: "Movie Name"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Poster"
        name: "poster"
        widget: "image"
        required: false

      - label: "Details"
        name: "body"
        widget: "markdown"

